general:
  enabled: true

runtime:
  # Как часто проверяем зоны игроков и состояние охраны.
  scan-interval-seconds: 5
  # Небольшой запас вокруг фактических границ NBT для сообщения о входе.
  zone-padding-blocks: 8

  # Охрана восстанавливается только после полной зачистки и только без игроков рядом.
  guard-respawn-seconds: 7200
  guard-respawn-player-exclusion-radius: 64

  # Мини-босс не может быть уведён слишком далеко от своей структуры.
  boss-leash-radius: 64
  boss-return-heal-fraction: 0.25
  bossbar-radius: 48

generation:
  # Генерируем только в новых чанках обычного мира.
  enabled: true
  # Если список пустой — разрешён любой overworld-мир.
  worlds: []

  # Регион 24x24 чанка. При margin=10 соседние кандидатные точки
  # оказываются примерно в 336-432 блоках друг от друга.
  region-size-chunks: 24
  margin-chunks: 10
  spawn-chance-per-region: 0.60
  min-distance-from-spawn-blocks: 500
  place-delay-ticks: 10
  salt: 918273645

  # Защита от кривой установки на склонах.
  terrain-sample-radius: 12
  max-height-difference: 7

structure-mobs:
  health-multiplier: 2.0
  damage-multiplier: 1.5
  elite-chance: 0.20

  # Обычный структурный моб: 20-40% на 1-2 бронзовые монеты.
  bronze-coins:
    chance-min: 0.20
    chance-max: 0.40
    amount-min: 1
    amount-max: 2

elite-mobs:
  health-multiplier: 3.0
  damage-multiplier: 2.0
  speed-multiplier: 1.15

  # Элитный моб: 30-50% на 2-4 бронзовые монеты.
  bronze-coins:
    chance-min: 0.30
    chance-max: 0.50
    amount-min: 2
    amount-max: 4

gear:
  # Структурные мобы носят минимум железо/алмаз с чарами.
  diamond-chance-normal: 0.40
  # Элитки чаще всего в алмазке.
  diamond-chance-elite: 0.80
  protection-normal-min: 2
  protection-normal-max: 3
  protection-elite-min: 3
  protection-elite-max: 4

  # Мини-босс: смесь алмазной и незеритовой брони, Protection II-III.
  boss-netherite-piece-chance: 0.60
  boss-protection-min: 2
  boss-protection-max: 3

  # Шмот нужен для сложности, а не как основной источник алмазок/незеритки.
  drop-chance: 0.01

miniboss:
  health-multiplier: 5.0
  damage-multiplier: 3.0
  speed-multiplier: 1.40
  resistance-amplifier: 0 # Resistance I

  bronze-coins-min: 13
  bronze-coins-max: 16
  shard-drop-chance: 0.05
  respawn-seconds: 7200

  abilities-per-boss-min: 1
  abilities-per-boss-max: 2
  ability-cooldown-min-seconds: 10
  ability-cooldown-max-seconds: 15

  summon:
    min-count: 2
    max-count: 4
    max-alive-minions: 12
    radius: 5.0

  knockback:
    radius: 9.0
    horizontal-strength: 1.35
    vertical-strength: 0.35

  regeneration:
    radius: 10.0
    duration-min-seconds: 5
    duration-max-seconds: 6
    amplifier: 1 # Regeneration II

  debuff:
    radius: 10.0
    duration-min-seconds: 5
    duration-max-seconds: 8

chests:
  # Монетки генерируются только один раз при первом открытии контейнера.
  bronze-coin-chance: 0.35
  bronze-coins-min: 2
  bronze-coins-max: 5

  # Ценный лут ограничен: обычно 1-2 попытки, редкие структуры получают бонус.
  valuable-rolls-min: 1
  valuable-rolls-max: 2
  valuable-roll-chance: 0.45
  enchanted-book-weight: 25
  experience-bottle-weight: 35
  precious-resource-weight: 40
  mob-loot-chance: 0.60

